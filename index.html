<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aira</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050816; color: #fff; }
    body { position: relative; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 14px 18px; }
    body::before { content: ""; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; z-index: -2; background: conic-gradient(from 0deg, #0b132b, #2b0d42, #0d3b4c, #3d1328, #102542, #0b132b); animation: slowBgSpin 28s linear infinite; filter: blur(28px) saturate(1.25); opacity: 0.95; }
    body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, rgba(4, 10, 24, 0.25) 0%, rgba(2, 6, 15, 0.72) 100%); pointer-events: none; }
    @keyframes slowBgSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .top-bar { width: 100%; max-width: 440px; display: flex; justify-content: flex-end; position: relative; z-index: 40; }
    #menuBtn { background: rgba(5, 14, 30, 0.85); border: 1px solid rgba(0, 240, 255, 0.35); color: #e8fbff; width: 38px; height: 38px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
    .menu-panel { display: none; position: absolute; top: 46px; right: 0; width: 270px; background: rgba(8, 18, 38, 0.96); border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 14px; padding: 12px; z-index: 50; }
    .menu-panel.open { display: flex; flex-direction: column; gap: 10px; }
    .menu-item { display: flex; flex-direction: column; gap: 5px; font-size: 0.82rem; color: #cbeeff; }
    .menu-panel select, .menu-panel input[type="text"] { width: 100%; background: rgba(3, 9, 20, 0.9); border: 1px solid rgba(0, 240, 255, 0.3); color: #fff; padding: 7px 9px; border-radius: 8px; font-size: 0.82rem; outline: none; user-select: text; }
    .menu-panel input[type="range"] { width: 100%; accent-color: #00f0ff; }
    .menu-actions { display: flex; gap: 8px; }
    .menu-btn-small { flex: 1; background: rgba(0, 240, 255, 0.16); border: 1px solid rgba(0, 240, 255, 0.4); color: #fff; padding: 7px 8px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .middle-area { width: 100%; max-width: 440px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; padding: 6px 0; }
    .chat-log { width: 100%; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 6px 10px; border-radius: 12px; background: rgba(4, 13, 28, 0.62); border: 1px solid rgba(0, 240, 255, 0.18); user-select: text; }
    .chat-log:empty { display: none; }
    .msg-row { font-size: 0.86rem; line-height: 1.35; padding: 6px 9px; border-radius: 9px; word-wrap: break-word; }
    .msg-user { align-self: flex-end; background: rgba(0, 240, 255, 0.16); border: 1px solid rgba(0, 240, 255, 0.32); color: #e6fbff; }
    .msg-ai { align-self: flex-start; background: rgba(255, 42, 133, 0.15); border: 1px solid rgba(255, 42, 133, 0.3); color: #ffe8f2; }
    .stage { position: relative; display: flex; align-items: center; justify-content: center; width: 165px; height: 165px; pointer-events: none; flex-shrink: 0; }
    .pink-core-glow { position: absolute; width: 105px; height: 105px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 28, 138, 0.72) 0%, rgba(214, 15, 112, 0.42) 48%, rgba(120, 8, 72, 0.12) 72%, rgba(0, 0, 0, 0) 100%); box-shadow: 0 0 38px rgba(255, 24, 130, 0.38); transition: transform 0.35s ease; }
    .stage.active .pink-core-glow { transform: scale(1.18); }
    canvas { position: relative; z-index: 2; display: block; width: 165px; height: 165px; pointer-events: none; }
    .controls { position: relative; z-index: 20; text-align: center; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    #status { width: 100%; font-size: 0.85rem; color: #d9f8ff; background: rgba(4, 13, 28, 0.78); border: 1px solid rgba(41, 244, 255, 0.28); border-radius: 10px; padding: 6px 10px; min-height: 32px; word-wrap: break-word; }
    .chat-box { width: 100%; display: flex; gap: 8px; z-index: 25; }
    #msgInput { flex: 1; background: rgba(5, 14, 30, 0.88); border: 1px solid rgba(0, 240, 255, 0.45); color: #fff; padding: 10px 12px; border-radius: 12px; font-size: 0.92rem; outline: none; user-select: text; }
    #sendBtn { background: rgba(0, 240, 255, 0.22); border: 1px solid #00f0ff; color: #00f0ff; padding: 10px 15px; border-radius: 12px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .action-row { width: 100%; display: flex; gap: 10px; justify-content: center; }
    #micBtn, #callModeBtn { flex: 1; position: relative; z-index: 30; background: rgba(0, 240, 255, 0.16); border: 2px solid #00f0ff; color: #00f0ff; padding: 9px 12px; font-size: 0.92rem; border-radius: 28px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-art { width: 24px; height: 18px; flex-shrink: 0; display: block; }
    #micBtn.listening { background: #ff2a85; color: #fff; border-color: #ffad33; }
    #callModeBtn.active { background: #16a34a; color: #fff; border-color: #86efac; }
  </style>
</head>
<body>
  <div class="top-bar">
    <button id="menuBtn" type="button">⋮</button>
    <div class="menu-panel" id="menuPanel">
      <div class="menu-item"><label for="voiceSelect">Voice</label><select id="voiceSelect"></select></div>
      <div class="menu-item"><label for="pitchRange">Pitch</label><input id="pitchRange" type="range" min="0.6" max="1.6" step="0.1" value="1.1"></div>
      <div class="menu-item"><label for="rateRange">Speed</label><input id="rateRange" type="range" min="0.7" max="1.4" step="0.1" value="1.0"></div>
      <div class="menu-item"><label for="keyInput">Key</label><input id="keyInput" type="text" placeholder="Key..."></div>
      <div class="menu-actions"><button id="saveKeyBtn" class="menu-btn-small" type="button">Save</button><button id="clearChatBtn" class="menu-btn-small" type="button">Clear</button></div>
    </div>
  </div>
  <div class="middle-area">
    <div class="chat-log" id="chatLog"></div>
    <div class="stage" id="stageBox"><div class="pink-core-glow"></div><canvas id="sphereCanvas" width="165" height="165"></canvas></div>
  </div>
  <div class="controls">
    <div id="status">Chat ready</div>
    <div class="chat-box"><input id="msgInput" type="text" placeholder="Yahan likh kar bhejein..."><button id="sendBtn" type="button">Send</button></div>
    <div class="action-row">
      <button id="micBtn" type="button">
        <svg class="btn-art" viewBox="0 0 36 24" fill="none"><rect x="2" y="8" width="2.5" height="8" rx="1.2" fill="currentColor"/><rect x="7" y="4" width="2.5" height="16" rx="1.2" fill="currentColor"/><rect x="12" y="10" width="2.5" height="4" rx="1.2" fill="currentColor"/><rect x="17" y="2" width="2.5" height="20" rx="1.2" fill="currentColor"/><rect x="22" y="6" width="2.5" height="12" rx="1.2" fill="currentColor"/><rect x="27" y="9" width="2.5" height="6" rx="1.2" fill="currentColor"/><rect x="32" y="5" width="2.5" height="14" rx="1.2" fill="currentColor"/></svg>
        <span>Dhawani</span>
      </button>
      <button id="callModeBtn" type="button">
        <svg class="btn-art" viewBox="0 0 28 24" fill="none"><path d="M5 6C7.5 3.5 11.5 3.5 14 6L12.2 8.2C10.8 6.9 8.7 6.9 7.3 8.2L5 6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 13C4 9.7 8.5 7 14 7C19.5 7 24 9.7 24 13V19H4V13Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="14" cy="14" r="3.5" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Telephone</span>
      </button>
    </div>
  </div>
  <script>
        const menuBtn = document.getElementById('menuBtn'), menuPanel = document.getElementById('menuPanel'), voiceSelect = document.getElementById('voiceSelect'), pitchRange = document.getElementById('pitchRange'), rateRange = document.getElementById('rateRange'), keyInput = document.getElementById('keyInput'), saveKeyBtn = document.getElementById('saveKeyBtn'), clearChatBtn = document.getElementById('clearChatBtn'), chatLog = document.getElementById('chatLog'), statusText = document.getElementById('status'), msgInput = document.getElementById('msgInput'), sendBtn = document.getElementById('sendBtn'), micBtn = document.getElementById('micBtn'), callModeBtn = document.getElementById('callModeBtn');
    let API_KEY = (localStorage.getItem('saved_gemini_key') || "").replace(/\s+/g, '');
    if (API_KEY) keyInput.value = API_KEY;
    let savedVoiceURI = localStorage.getItem('saved_voice_uri') || "", savedPitch = parseFloat(localStorage.getItem('saved_pitch') || "1.1"), savedRate = parseFloat(localStorage.getItem('saved_rate') || "1.0");
    pitchRange.value = savedPitch; rateRange.value = savedRate;

    function addBubble(sender, text) {
      const div = document.createElement('div');
      div.className = 'msg-row ' + (sender === 'user' ? 'msg-user' : 'msg-ai');
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuPanel.classList.toggle('open'); });
    document.addEventListener('click', (e) => { if (!menuPanel.contains(e.target) && e.target !== menuBtn) menuPanel.classList.remove('open'); });

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      voiceSelect.innerHTML = "";
      voices.forEach((v, idx) => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        if (savedVoiceURI ? v.voiceURI === savedVoiceURI : idx === 0) opt.selected = true;
        voiceSelect.appendChild(opt);
      });
    }
    if ('speechSynthesis' in window) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
    voiceSelect.addEventListener('change', () => { savedVoiceURI = voiceSelect.value; localStorage.setItem('saved_voice_uri', savedVoiceURI); });
    pitchRange.addEventListener('input', () => { savedPitch = parseFloat(pitchRange.value); localStorage.setItem('saved_pitch', String(savedPitch)); });
    rateRange.addEventListener('input', () => { savedRate = parseFloat(rateRange.value); localStorage.setItem('saved_rate', String(savedRate)); });
    saveKeyBtn.addEventListener('click', () => { API_KEY = keyInput.value.replace(/\s+/g, ''); localStorage.setItem('saved_gemini_key', API_KEY); statusText.innerText = API_KEY ? "Saved" : "Empty"; menuPanel.classList.remove('open'); });
    clearChatBtn.addEventListener('click', () => { chatHistory = []; chatLog.innerHTML = ""; statusText.innerText = "Cleared"; menuPanel.classList.remove('open'); });

    const canvas = document.getElementById('sphereCanvas'), ctx = canvas.getContext('2d'), stageBox = document.getElementById('stageBox');
    const CX = 82.5, CY = 82.5;
    let angleY = 0, angleX = 0.25, rotSpeed = 0.014, spread = 0, targetSpread = 0;
    const particles = [];
    for (let i = 0; i < 240; i++) {
      const phi = Math.acos(-1 + (2 * i) / 240), theta = Math.sqrt(240 * Math.PI) * phi;
      const dirX = Math.cos(theta) * Math.sin(phi), dirY = Math.sin(theta) * Math.sin(phi), dirZ = Math.cos(phi);
      const r0 = 30 + (i % 7) * 2.4;
      particles.push({ baseX: r0 * dirX, baseY: r0 * dirY, baseZ: r0 * dirZ, dirX, dirY, dirZ, radius: 1.55 + (i % 4) * 0.45, phase: i * 0.37, isOrange: i % 3 === 0, isPinkAccent: i % 5 === 0 });
    }
    function setSpeakingState(active) { targetSpread = active ? 1 : 0; rotSpeed = active ? 0.042 : 0.014; stageBox.classList.toggle('active', active); }
    function drawSphere() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      spread += (targetSpread - spread) * 0.09;
      const g = ctx.createRadialGradient(CX, CY, 5, CX, CY, 66);
      g.addColorStop(0, 'rgba(255, 45, 148, 0.78)'); g.addColorStop(0.55, 'rgba(195, 14, 105, 0.42)'); g.addColorStop(1, 'rgba(195, 14, 105, 0)');
      ctx.beginPath(); ctx.arc(CX, CY, 66, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
      const proj = particles.map((p) => {
        const push = spread * 20 + Math.sin(Date.now() * 0.004 + p.phase) * 1.6;
        const px = p.baseX + p.dirX * push, py = p.baseY + p.dirY * push, pz = p.baseZ + p.dirZ * push;
        const x1 = px * Math.cos(angleY) - pz * Math.sin(angleY), z1 = pz * Math.cos(angleY) + px * Math.sin(angleY);
        const y2 = py * Math.cos(angleX) - z1 * Math.sin(angleX), z2 = z1 * Math.cos(angleX) + py * Math.sin(angleX);
        const persp = 155 / (155 + z2);
        return { sx: CX + x1 * persp, sy: CY + y2 * persp, z: z2, r: Math.max(1.0, p.radius * persp), isOrange: p.isOrange, isPinkAccent: p.isPinkAccent };
      }).sort((a, b) => b.z - a.z);
      proj.forEach((pt) => {
        const color = pt.isOrange ? (pt.z < 0 ? '#ff9d1c' : '#c96800') : pt.isPinkAccent ? (pt.z < 0 ? '#ff6ec7' : '#b51777') : (pt.z < 0 ? '#3bf4ff' : '#0088b8');
        ctx.beginPath(); ctx.arc(pt.sx, pt.sy, pt.r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      });
      angleY += rotSpeed;
      requestAnimationFrame(drawSphere);
    }
    drawSphere();

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = SpeechRec ? new SpeechRec() : null, chatHistory = [], isRecognizing = false, isCallMode = false;
    const FALLBACKS = { youtube: 'https://www.youtube.com', google: 'https://www.google.com', whatsapp: 'https://web.whatsapp.com', instagram: 'https://www.instagram.com', gmail: 'https://mail.google.com', chatgpt: 'https://chatgpt.com', gemini: 'https://gemini.google.com' };

    function triggerAppAction(appName) {
      const clean = (appName || '').trim().toLowerCase();
      statusText.innerText = "APP:" + clean;
      window.location.hash = "app=" + encodeURIComponent(clean);
      const key = Object.keys(FALLBACKS).find((k) => clean.includes(k));
      const url = key ? FALLBACKS[key] : 'https://www.google.com/search?q=' + encodeURIComponent(clean);
      setTimeout(() => window.open(url, '_blank'), 900);
    }

    function speak(text, shouldContinueCall = false) {
      if (!('speechSynthesis' in window)) { if (shouldContinueCall && isCallMode) startCallListen(); return; }
      try { window.speechSynthesis.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text.replace(/[*#_]/g, ''));
      const chosen = window.speechSynthesis.getVoices().find((v) => v.voiceURI === savedVoiceURI);
      u.voice = chosen || null; u.lang = (chosen && chosen.lang) || 'hi-IN'; u.pitch = savedPitch; u.rate = savedRate;
      u.onstart = () => setSpeakingState(true);
      u.onend = u.onerror = () => { setSpeakingState(false); if (shouldContinueCall && isCallMode) setTimeout(startCallListen, 250); };
      window.speechSynthesis.speak(u);
    }

    function startCallListen() { if (!rec || isRecognizing || !isCallMode) return; try { rec.start(); } catch (e) {} }

    callModeBtn.addEventListener('click', () => {
      isCallMode = !isCallMode;
      callModeBtn.classList.toggle('active', isCallMode);
      if (isCallMode) { statusText.innerText = "Telephone mode on"; setSpeakingState(true); startCallListen(); }
      else { isRecognizing = false; micBtn.classList.remove('listening'); try { if (rec) rec.stop(); } catch (e) {} try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {} setSpeakingState(false); statusText.innerText = "Chat ready"; }
    });

    async function callGeminiWithFallback(currentKey, systemRule, contents) {
      for (const m of ['gemini-2.5-flash', 'gemini-2.0-flash']) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(currentKey)}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ systemInstruction: { parts: [{ text: systemRule }] }, contents })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error?.message || `HTTP ${res.status}`);
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!reply) throw new Error("Khali jawab aaya");
          return reply;
        } catch (err) { if (m === 'gemini-2.0-flash') throw err; }
      }
    }

    async function askAssistant(command, fromVoice = false) {
      const currentKey = (keyInput.value || API_KEY || localStorage.getItem('saved_gemini_key') || '').replace(/\s+/g, '');
      if (currentKey) { API_KEY = currentKey; keyInput.value = currentKey; localStorage.setItem('saved_gemini_key', currentKey); }
      if (!currentKey) { statusText.innerText = "Menu mein key daal kar Save karein"; return; }
      statusText.innerText = "Thinking..."; setSpeakingState(true);
      const systemRule = `तुम आयरा नाम की पर्सनल असिस्टेंट हो। तुम्हारे मालिक और निर्माता दिनेश कुमार गुप्ता हैं। जब कोई पूछे कि तुम्हारा मालिक या ओनर कौन है या तुम्हें किसने बनाया है, तो सीधा बताओ कि दिनेश कुमार गुप्ता हैं। बातचीत में यूज़र को "सर" कहो और हर सवाल का छोटा व सीधा जवाब हिंदी में दो।
अगर किसी ऐप को खोलने के लिए कहा जाए (जैसे YouTube, WhatsApp, Instagram, Gmail, ChatGPT, Google या कोई अन्य ऐप) तो जवाब के साथ [APP:ऐप_का_नाम] लिखो।
अगर कॉल करने कहें तो [CALL:नंबर], व्हाट्सएप मैसेज तैयार करने कहें तो [WA:संदेश], गूगल सर्च कहें तो [GO:शब्द] लिखो।`;
      const nextHistory = [...chatHistory, { role: "user", parts: [{ text: command }] }].slice(-6);
      try {
        let reply = await callGeminiWithFallback(currentKey, systemRule, nextHistory);
        chatHistory = [...nextHistory, { role: "model", parts: [{ text: reply }] }].slice(-6);
        const appM = reply.match(/\[APP:(.*?)\]/), callM = reply.match(/\[CALL:(.*?)\]/), waM = reply.match(/\[WA:(.*?)\]/), goM = reply.match(/\[GO:(.*?)\]/);
        if (appM) { reply = reply.replace(/\[APP:.*?\]/, '').trim(); triggerAppAction(appM[1].trim()); }
        else if (callM) { const num = callM[1].replace(/[^0-9+]/g, ''); reply = reply.replace(/\[CALL:.*?\]/, '').trim(); setTimeout(() => location.href = 'tel:' + num, 800); }
        else if (waM) { const msg = waM[1].trim(); reply = reply.replace(/\[WA:.*?\]/, '').trim(); setTimeout(() => window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank'), 800); }
        else if (goM) { const q = goM[1]; reply = reply.replace(/\[GO:.*?\]/, '').trim(); setTimeout(() => window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank'), 800); }
        addBubble('ai', reply);
        if (!statusText.innerText.startsWith("APP:")) statusText.innerText = isCallMode ? "Telephone mode on" : "Ready";
        speak(reply, fromVoice && isCallMode);
      } catch (err) {
        setSpeakingState(false); statusText.innerText = "Truti: " + err.message;
        if (fromVoice && isCallMode) setTimeout(startCallListen, 800);
      }
    }

    function sendTypedMessage() { const t = msgInput.value.trim(); if (!t) return; msgInput.value = ""; addBubble('user', t); askAssistant(t, false); }
    sendBtn.addEventListener('click', sendTypedMessage);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendTypedMessage(); } });

    if (rec) {
      rec.lang = 'hi-IN'; rec.interimResults = false;
      micBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (isRecognizing) { try { rec.stop(); } catch (err) {} isRecognizing = false; micBtn.classList.remove('listening'); return; }
        try { rec.start(); } catch (err) { try { rec.stop(); } catch (e2) {} setTimeout(() => { try { rec.start(); } catch (e3) { statusText.innerText = "Dhawani retry"; } }, 180); }
      });
      rec.onstart = () => { isRecognizing = true; micBtn.classList.add('listening'); statusText.innerText = isCallMode ? "Telephone sun raha hai..." : "Dhawani sun rahi hai..."; setSpeakingState(true); };
      rec.onresult = (e) => { const t = e.results[0][0].transcript; addBubble('user', t); micBtn.classList.remove('listening'); askAssistant(t, true); };
      rec.onerror = (e) => { isRecognizing = false; micBtn.classList.remove('listening'); if (!('speechSynthesis' in window) || !window.speechSynthesis.speaking) setSpeakingState(false); statusText.innerText = e.error === 'not-allowed' ? "Mic permission required" : (isCallMode ? (setTimeout(startCallListen, 600), "Telephone sun raha hai...") : "Try again"); };
      rec.onend = () => { isRecognizing = false; micBtn.classList.remove('listening'); if ((!('speechSynthesis' in window) || !window.speechSynthesis.speaking) && !isCallMode) setSpeakingState(false); };
    } else { statusText.innerText = "Voice unsupported"; }
  </script>
</body>
</html>
